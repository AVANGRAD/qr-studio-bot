<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>QR Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app/static/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1>QR Studio</h1>
        <p id="status">…</p>
      </div>
      <button id="close" class="close" type="button" aria-label="Close">×</button>
    </header>

    <section class="preview-card">
      <div class="preview-wrap">
        <img id="preview" alt="QR preview" src="/app/preview.png?shape=square&module=dot&eye=circle&palette=blue&size=400">
      </div>
      <div class="preview-info">
        <strong id="preview-title">QR Studio</strong>
        <p id="summary"></p>
      </div>
    </section>

    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <div id="subcats" class="subcats"></div>
    <main id="grid" class="grid" aria-live="polite"></main>

    <footer class="footer">
      <button id="apply" class="primary" type="button">QR Studio</button>
    </footer>
  </div>
  <script src="/app/static/app.js?v=i18n1"></script>
</body>
</html>
